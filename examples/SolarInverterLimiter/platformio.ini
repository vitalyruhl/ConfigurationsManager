; Shared application settings; profiles contain only their differences.
[platformio]
description = ESP32 RS485 solar inverter limiter example
default_envs = usb
libdeps_dir = ${platformio.core_dir}/libdeps/ConfigurationsManager-examples/SolarInverterLimiter

[env]
platform = platformio/espressif32@7.0.1
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -Wno-deprecated-declarations
    -std=gnu++17
    -flto
    -DUNIT_TEST
    -DSIL_DEACTIVATE_BME280_CARD=1
    -DCM_ENABLE_LIVE_UI=0
    -DCM_ENABLE_SETTINGS_UI=1
    -DCM_ENABLE_LOGGING=0
    -DCM_ENABLE_VERBOSE_LOGGING=0
    -DCM_DISABLE_GUI_LOGGING=1
    -DFEATURE_OLED_DISPLAY_ENABLED=0
    -DFEATURE_MQTT_LOGGER_ENABLED=0
    -DCM_MQTT_BOUNDED_IO=1
    -DCM_MQTT_WIFI_UPTIME=0
lib_deps =
    knolleary/PubSubClient@^2.8
    ks-tec/BME280_I2C@1.4.1+002
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@^1.17.4
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    symlink://../..
test_ignore = src/main.cpp
extra_scripts =
    pre:./tools/precompile_wrapper.py
    post:./tools/enable_lto.py

[env:usb]
; Let PlatformIO detect USB, or pass --upload-port / --port explicitly.

[env:ota]
upload_protocol = espota
; Supply the device host with --upload-port when an upload is intended.
; Configure matching OTA authentication locally when OTA_PASSWORD is set.
upload_flags =
    -t
    30

; Kept for existing users; the shared application profile already disables OLED.
[env:ota_no_oled]
extends = env:ota

[env:ota_no_oled_no_bme]
extends = env:ota_no_oled
build_flags =
    ${env.build_flags}
    -DFEATURE_BME280_ENABLED=0
