[platformio]
default_envs = usb
description = SolarBatteryTelemetry WiFi + OTA + BLE example
libdeps_dir = ${platformio.core_dir}/libdeps/ConfigurationsManager-examples/SolarBatteryTelemetry

[env]
platform = platformio/espressif32@7.0.1
board = nodemcu-32s
board_build.partitions = partitions/dual-ota-1792k.csv
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -flto
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DMQTT_SOCKET_TIMEOUT=1
    -DCM_BLE_TX_MAX_BYTES=9
    -DCM_ENABLE_LOGGING=0
    -DCM_ENABLE_VERBOSE_LOGGING=0
    -DCM_DISABLE_GUI_LOGGING=1
    -DCM_ENABLE_LIVE_UI=0
    -DCM_ENABLE_SETTINGS_UI=1
lib_deps =
    symlink://../..
    bblanchon/ArduinoJson@~7.4.3
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    h2zero/NimBLE-Arduino@2.5.1
    knolleary/PubSubClient@2.8
extra_scripts =
    pre:../../tools/preCompile_script.py
    post:tools/ble_lto.py

[env:usb]
upload_protocol = esptool

[env:ota]
upload_protocol = espota
