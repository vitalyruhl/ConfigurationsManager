; Common firmware and dependencies using the enclosing CM checkout.
[platformio]
description = ESP32 boiler control with web configuration
extra_configs = platformio.local.ini
default_envs = usb
libdeps_dir = ${platformio.core_dir}/libdeps/ConfigurationsManager-examples/BoilerSaver

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
    -fno-lto
build_flags =
    -Wno-deprecated-declarations
    -std=gnu++17
    -flto
    -DCM_ENABLE_LIVE_UI=1
    -DCM_ENABLE_LOGGING=0
    -DCM_ENABLE_VERBOSE_LOGGING=0
    -DCM_LOGGING_LEVEL=CM_LOG_LEVEL_WARN
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    knolleary/PubSubClient@2.8
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SSD1306@2.5.16
    adafruit/Adafruit BusIO@1.17.4
    symlink://../..
test_ignore = src/main.cpp
extra_scripts = pre:./tools/precompile_wrapper.py

[env:usb]
upload_port = COM3

[env:ota]
upload_protocol = espota
; Reserved example host; configure an actual target only in the ignored local file.
upload_port = example.invalid
upload_flags =
    -t
    60

; Operator-confirmed COM8 station wiring and isolated test identity only.
[env:testesp]
upload_port = COM8
build_flags =
    ${env.build_flags}
    -DBOILERSAVER_TESTESP=1
