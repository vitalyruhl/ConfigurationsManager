name: Full Repository Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full-repository-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio==6.1.19

      - name: Install static analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 cppcheck
          clang-format-18 --version
          cppcheck --version

      - name: Run full repository gate
        shell: pwsh
        run: ./tools/build/run-full-repository-gate.ps1 -FailFast -LogRoot $env:RUNNER_TEMP

      - name: Upload repository gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-gate-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/ConfigurationsManager-full-gate-*
          if-no-files-found: warn
