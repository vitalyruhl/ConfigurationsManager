name: PlatformIO Linux Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio

      - name: Compile embedded Unity test suite
        run: pio test -e usb --without-uploading --without-testing

      - name: Build ESP32 Arduino project
        run: pio run -e usb
